<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="blog-shell">
    <aside class="blog-sidebar">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <img class="site-avatar" src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="小羊哥的头像">
        <span class="site-title">{{ site.title }}</span>
      </a>
      <p class="site-description">{{ site.description }}</p>
      <nav class="article-nav" aria-label="文章目录">
        <p class="nav-title">文章目录</p>
        {{ content }}
      </nav>
    </aside>
    <main id="article-content" class="article-content">
      <div class="welcome">
        <h1>欢迎来到 {{ site.title }}</h1>
        <p>{{ site.description }}</p>
        <p>请从左侧目录选择一篇文章开始阅读。</p>
      </div>
    </main>
    <aside id="article-toc" class="article-toc" aria-label="本页大纲" hidden>
      <p class="toc-title">本页大纲</p>
      <nav id="article-toc-links"></nav>
    </aside>
  </div>
  <script>
    (() => {
      const content = document.getElementById("article-content");
      const toc = document.getElementById("article-toc");
      const tocLinks = document.getElementById("article-toc-links");
      const tree = document.getElementById("category-tree");
      const posts = JSON.parse(document.getElementById("posts-data").textContent);
      const pathOf = value => new URL(value, window.location.origin).pathname;
      const allowedPaths = new Set(posts.map(post => pathOf(post.url)));
      const root = new Map();

      posts.forEach(post => {
        const categories = Array.isArray(post.categories) && post.categories.length
          ? post.categories
          : ["未分类"];
        let branch = root;
        let node;

        categories.forEach(category => {
          if (!branch.has(category)) {
            branch.set(category, { children: new Map(), posts: [] });
          }
          node = branch.get(category);
          branch = node.children;
        });
        node.posts.push(post);
      });

      function createPost(post) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.className = "js-post-link";
        link.href = post.url;
        link.textContent = post.title;
        item.append(link);
        return item;
      }

      function createFolder(name, node, depth, open) {
        const folder = document.createElement("details");
        folder.className = `tree-folder tree-depth-${depth}`;
        folder.open = open;

        const summary = document.createElement("summary");
        summary.textContent = name;
        folder.append(summary);

        const children = document.createElement("ul");
        children.className = "tree-children";
        node.children.forEach((child, childName) => {
          const item = document.createElement("li");
          item.append(createFolder(childName, child, depth + 1, false));
          children.append(item);
        });

        node.posts.forEach(post => children.append(createPost(post)));
        folder.append(children);
        return folder;
      }

      let topIndex = 0;
      root.forEach((node, name) => {
        tree.append(createFolder(name, node, 0, topIndex === 0));
        topIndex += 1;
      });

      function buildToc() {
        const headings = [...content.querySelectorAll("h2, h3, h4")];
        tocLinks.replaceChildren();
        toc.hidden = headings.length === 0;

        headings.forEach((heading, index) => {
          if (!heading.id) heading.id = `article-heading-${index + 1}`;

          const link = document.createElement("a");
          link.href = `#${heading.id}`;
          link.className = `toc-level-${heading.tagName.slice(1)}`;
          link.textContent = heading.textContent;
          tocLinks.append(link);
        });
      }

      function scrollToHashOrTop() {
        const targetId = decodeURIComponent(window.location.hash.slice(1));
        const target = targetId && document.getElementById(targetId);

        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      async function loadPost(postPath, pushHistory = true) {
        const path = pathOf(postPath);
        if (!allowedPaths.has(path)) return;
        content.innerHTML = "<p>正在加载文章……</p>";

        try {
          const response = await fetch(path);
          if (!response.ok) throw new Error("文章加载失败");
          const html = await response.text();
          const page = new DOMParser().parseFromString(html, "text/html");
          const article = page.querySelector("section");
          if (!article) throw new Error("未找到文章正文");

          content.innerHTML = article.innerHTML;
          document.title = page.title;
          buildToc();
          document.querySelectorAll(".js-post-link").forEach(link => {
            link.classList.toggle("active", pathOf(link.href) === path);
          });

          if (pushHistory) {
            const url = `${window.location.pathname}?post=${encodeURIComponent(path)}`;
            window.history.pushState({ post: path }, "", url);
          }
          scrollToHashOrTop();
        } catch (error) {
          content.innerHTML = "<p>文章加载失败，请稍后重试。</p>";
        }
      }

      tree.addEventListener("click", event => {
        const link = event.target.closest(".js-post-link");
        if (!link) return;
        event.preventDefault();
        loadPost(link.href);
      });

      window.addEventListener("popstate", () => {
        const postPath = new URLSearchParams(window.location.search).get("post");
        if (postPath) loadPost(postPath, false);
      });

      window.addEventListener("hashchange", scrollToHashOrTop);

      const initialPost = new URLSearchParams(window.location.search).get("post");
      if (initialPost) loadPost(initialPost, false);
    })();
  </script>
</body>
</html>
