---
layout: default
title: 首页
---
<p><a href="{{ site.baseurl }}/categories.html">查看全部分类</a></p>
<h1>{{ site.title }}</h1>
<p>{{ site.description }}</p>

<h2>文章</h2>

<ul>
  {% for post in site.posts %}
  <li>
    <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
    <small>{{ post.date | date: "%Y-%m-%d" }}</small>
  </li>
  {% endfor %}
</ul>
